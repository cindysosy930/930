<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>二分檢索表</title>
<style>
  :root {
    --paper: #fffcf4;
    --bg: #f7f3e8;
    --ink: #1a1a1a;
    --line: #222222;
    --muted: #6b6560;
    --hint: #8a8378;
    --box-bg: #fffcf4;
    --box-border: #222222;
    --chrome: #f3efe4;
    --border-soft: #e4dcc8;
    --hold-bg: #f8eccc;
    --hold-border: #c4a04a;
    --hold-ink: #6a4f12;
    --btn-blue: #2b5a9e;
    --btn-blue-bg: #eef3fa;
    --danger: #7a3333;
    --avatar-ring: #d9d0bf;
    --drop-ok: #c5ddc0;
    --shadow: rgba(40, 30, 10, 0.1);
    --header-h: auto;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app-header {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px 6px;
    background: var(--chrome);
    border-bottom: 1px solid var(--border-soft);
    z-index: 30;
  }
  .header-text h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .header-text .lead {
    margin: 2px 0 0;
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.45;
    max-width: 42em;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .zoom-btns {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid #cfc6b4;
    border-radius: 8px;
    overflow: hidden;
    background: #fffdf8;
  }
  .zoom-btns button {
    appearance: none;
    border: 0;
    background: transparent;
    min-width: 44px;
    min-height: 44px;
    padding: 0 10px;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    cursor: pointer;
    border-right: 1px solid #e4dcc8;
  }
  .zoom-btns button:last-child { border-right: 0; }
  .zoom-btns button:active { background: #efe8d8; }
  #btnZoomFit { font-size: 0.78rem; padding: 0 10px; color: var(--muted); }
  #btnZoomReset { font-size: 0.8rem; min-width: 52px; color: var(--muted); }
  .btn-reset {
    appearance: none;
    border: 1px solid #c4a0a0;
    background: #fff8f8;
    color: var(--danger);
    font: inherit;
    font-size: 0.92rem;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-reset:active { background: #f8eaea; }

  .tray {
    flex-shrink: 0;
    background: var(--chrome);
    border-bottom: 1px solid var(--border-soft);
    padding: 8px 12px 10px;
    z-index: 28;
  }
  .tray.is-target {
    background: #eaf3e8;
    outline: 2px solid #7aa86a;
    outline-offset: -2px;
  }
  .tray-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 6px;
    text-align: center;
  }
  .tray-hint { color: var(--hint); }
  .tray-avatars {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: flex-end;
    min-height: 72px;
    max-width: 1100px;
    margin: 0 auto;
    padding-top: 8px;
  }
  .tray-empty {
    font-size: 0.8rem;
    color: var(--hint);
    padding: 8px;
  }

  .avatar {
    --avatar-size: 64px;
    width: var(--avatar-size);
    height: var(--avatar-size);
    border: 0;
    background: transparent;
    box-shadow: none;
    border-radius: 0;
    overflow: visible;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    flex-shrink: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }
  .avatar.has-crown { height: calc(var(--avatar-size) + 16px); }
  .avatar-face {
    width: var(--avatar-size);
    height: var(--avatar-size);
    border-radius: 50%;
    border: 2px solid var(--avatar-ring);
    overflow: hidden;
    background: #ddd;
    box-shadow: 0 1px 3px var(--shadow);
    display: block;
    flex-shrink: 0;
  }
  .avatar img,
  .avatar-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .avatar-crown {
    position: absolute;
    top: 0;
    left: 50%;
    width: 38px;
    height: 24px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  .avatar-crown svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .node-avatars .avatar,
  .hold-avatars .avatar { --avatar-size: 52px; }
  .node-avatars .avatar-crown,
  .hold-avatars .avatar-crown { width: 32px; height: 20px; }
  .avatar.is-dragging { opacity: 0.35; }
  .avatar:focus-visible { outline: none; }
  .avatar:focus-visible .avatar-face { outline: 3px solid var(--btn-blue); outline-offset: 2px; }

  .tree-viewport {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
    position: relative;
  }
  .tree-sizer { position: relative; margin: 0 auto; }
  .tree-scaler {
    transform-origin: 0 0;
    position: absolute;
    top: 0;
    left: 0;
  }
  .tree-inner {
    position: relative;
    background: var(--paper);
  }
  .tree-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
  }
  .tree-title {
    position: absolute;
    z-index: 2;
    text-align: center;
  }
  .tree-title input {
    font: inherit;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-align: center;
    border: 1px dashed transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    padding: 6px 10px;
    min-width: 10em;
    max-width: 90vw;
    min-height: 44px;
  }
  .tree-title input:hover { border-color: #ddd6c6; }
  .tree-title input:focus {
    outline: none;
    border-color: var(--btn-blue);
    background: #fff;
  }
  .tree-title input::placeholder { color: #b0aa9c; font-weight: 500; }

  .node {
    position: absolute;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .feature-input {
    font: inherit;
    font-size: 16px;
    text-align: center;
    border: 1px dashed transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    padding: 6px 8px;
    min-width: 8.5em;
    max-width: 16em;
    min-height: 44px;
  }
  .feature-input:hover { border-color: #ddd6c6; }
  .feature-input:focus {
    outline: none;
    border-color: var(--btn-blue);
    background: #fff;
  }
  .feature-input::placeholder { color: #b0aa9c; }

  .term-box {
    background: var(--box-bg);
    border: 2px solid var(--box-border);
    min-width: 148px;
    min-height: 52px;
    padding: 8px 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .term-box.is-target {
    background: #eef7ea;
    box-shadow: 0 0 0 3px #7aa86a;
  }
  .root-leaf .term-box {
    min-width: 560px;
    max-width: 760px;
  }
  .node-avatars {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: flex-end;
    min-height: 8px;
    width: 100%;
    padding-top: 10px;
  }
  .drop-hint {
    font-size: 0.75rem;
    color: var(--hint);
    text-align: center;
    padding: 10px 8px;
    line-height: 1.4;
  }
  .name-input {
    font: inherit;
    font-size: 16px;
    text-align: center;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 6px 4px;
    width: 100%;
    min-width: 7em;
    min-height: 40px;
  }
  .name-input:focus { outline: none; background: #fff; }
  .name-input::placeholder { color: #b0aa9c; }

  .btn-split,
  .btn-unsplit {
    appearance: none;
    font: inherit;
    cursor: pointer;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .btn-split {
    border: 1px solid var(--btn-blue);
    background: var(--btn-blue-bg);
    color: var(--btn-blue);
    font-size: 0.88rem;
  }
  .btn-split:active { background: #dce6f4; }
  .btn-unsplit {
    border: 1px solid #cfc6b4;
    background: #fffdf8;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .btn-unsplit:active { background: #efe8d8; }
  .branch-controls {
    position: relative;
    width: 220px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .branch-controls .btn-unsplit {
    position: absolute;
    left: 50%;
    margin-left: 14px;
    top: 0;
  }
  .branch-controls.is-target {
    background: #f8eccc;
    border-radius: 8px;
    box-shadow: 0 0 0 3px #c4a04a;
  }

  .hold-box {
    background: var(--hold-bg);
    border: 2px dashed var(--hold-border);
    border-radius: 8px;
    min-width: 200px;
    max-width: 420px;
    padding: 6px 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hold-box.is-target {
    background: #f3e4a8;
    box-shadow: 0 0 0 3px #c4a04a;
  }
  .hold-label {
    font-size: 0.75rem;
    color: var(--hold-ink);
    text-align: center;
    line-height: 1.35;
    padding: 2px 4px;
  }
  .hold-avatars {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: flex-end;
    width: 100%;
    min-height: 4px;
    padding-top: 8px;
  }

  .drag-ghost {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    --avatar-size: 64px;
    width: var(--avatar-size);
    height: var(--avatar-size);
    overflow: visible;
    transform: scale(1.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: transparent;
  }
  .drag-ghost.has-crown { height: calc(var(--avatar-size) + 16px); }
  .drag-ghost .avatar-face {
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
  }
  .drag-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 700px) {
    .app-header { flex-wrap: wrap; padding: 8px 10px 6px; }
    .header-text h1 { font-size: 1.05rem; }
    .header-text .lead { font-size: 0.76rem; }
    .header-actions { width: 100%; justify-content: flex-end; }
    .root-leaf .term-box { min-width: 260px; max-width: 100%; }
    .avatar { --avatar-size: 58px; }
    .tray-avatars { min-height: 64px; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
    .drag-ghost { transform: none; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="header-text">
      <h1>二分檢索表</h1>
      <p class="lead">請自行輸入特徵、按需要加入分層，並把頭像拖到檢索表中。</p>
    </div>
    <div class="header-actions">
      <div class="zoom-btns" role="group" aria-label="縮放檢索表">
        <button type="button" id="btnZoomOut" aria-label="縮小">−</button>
        <button type="button" id="btnZoomReset" title="重設為 100%">100%</button>
        <button type="button" id="btnZoomIn" aria-label="放大">+</button>
        <button type="button" id="btnZoomFit">適合</button>
      </div>
      <button type="button" class="btn-reset" id="btnReset">重設</button>
    </div>
  </header>

  <section class="tray" id="tray" data-drop="tray" aria-label="頭像區">
    <div class="tray-label">頭像<span class="tray-hint">（拖到檢索表；拖回此處可放回）</span></div>
    <div class="tray-avatars" id="trayAvatars"></div>
  </section>

  <main class="tree-viewport" id="treeViewport" aria-label="檢索表">
    <div class="tree-sizer" id="treeSizer">
      <div class="tree-scaler" id="treeScaler">
        <div class="tree-inner" id="treeInner"></div>
      </div>
    </div>
  </main>

  <div id="dragGhost" class="drag-ghost" hidden></div>

    scaler: document.getElementById("treeScaler"),
    inner: document.getElementById("treeInner"),
    ghost: document.getElementById("dragGhost"),
    btnReset: document.getElementById("btnReset"),
    btnZoomIn: document.getElementById("btnZoomIn"),
    btnZoomOut: document.getElementById("btnZoomOut"),
    btnZoomReset: document.getElementById("btnZoomReset"),
    btnZoomFit: document.getElementById("btnZoomFit")
  };

  function findNode(id, node) {
    node = node || state.root;
    if (node.id === id) return node;
    if (node.type === "branch") {
      return findNode(id, node.left) || findNode(id, node.right);
    }
    return null;
  }

  function walk(node, fn) {
    fn(node);
    if (node.type === "branch") {
      walk(node.left, fn);
      walk(node.right, fn);
    }
  }

  function avatarsIn(type, nodeId) {
    const out = [];
    for (let i = 0; i < AVATAR_COUNT; i++) {
      const loc = state.locations[String(i)];
      if (loc.type === type && (type === "tray" || loc.nodeId === nodeId)) out.push(String(i));
    }
    return out;
  }

  /* ---------- DOM: avatars ---------- */
  const CROWNED_ID = "4"; /* 左邊數起第 5 位 */
  const CROWN_SVG = '<svg viewBox="0 0 64 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 30 L8 16 L20 26 L32 8 L44 26 L56 16 L56 30 Z" fill="#f3c445" stroke="#8a5a10" stroke-width="1.6" stroke-linejoin="round"/><rect x="8" y="28" width="48" height="8" rx="2" fill="#e8b830" stroke="#8a5a10" stroke-width="1.6"/><circle cx="32" cy="8" r="3.5" fill="#ffe27a" stroke="#8a5a10" stroke-width="1.2"/><circle cx="8" cy="16" r="3" fill="#ffe27a" stroke="#8a5a10" stroke-width="1.2"/><circle cx="56" cy="16" r="3" fill="#ffe27a" stroke="#8a5a10" stroke-width="1.2"/><circle cx="20" cy="26" r="2.1" fill="#d44848"/><circle cx="32" cy="23.5" r="2.1" fill="#2d6cdf"/><circle cx="44" cy="26" r="2.1" fill="#d44848"/></svg>';

  function appendAvatarVisual(container, id) {
    const face = document.createElement("span");
    face.className = "avatar-face";
    const img = document.createElement("img");
    img.src = AVATAR_SRCS[Number(id)];
    img.alt = "";
    img.draggable = false;
    face.appendChild(img);
    container.appendChild(face);
    if (String(id) === CROWNED_ID) {
      container.classList.add("has-crown");
      const crown = document.createElement("span");
      crown.className = "avatar-crown";
      crown.setAttribute("aria-hidden", "true");
      crown.innerHTML = CROWN_SVG;
      container.appendChild(crown);
    }
  }

  function avatarEl(id, sizeClass) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "avatar";
    b.dataset.avatarId = id;
    b.setAttribute("aria-label", String(id) === CROWNED_ID ? "可拖拉的頭像（有皇冠）" : "可拖拉的頭像");
    appendAvatarVisual(b, id);
    return b;
  }

  function renderTray() {
    const ids = avatarsIn("tray");
    els.trayAvatars.textContent = "";
    if (ids.length === 0) {
      const p = document.createElement("div");
      p.className = "tray-empty";
      p.textContent = "頭像都已放到檢索表（拖回此處可放回）";
      els.trayAvatars.appendChild(p);
    } else {
      ids.forEach((id) => els.trayAvatars.appendChild(avatarEl(id)));
    }
  }

  function fillAvatarRow(container, ids) {
    container.textContent = "";
    ids.forEach((id) => container.appendChild(avatarEl(id)));
  }

  /* ---------- DOM: tree structure ---------- */
  function el(tag, className, attrs) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "text") n.textContent = attrs[k];
        else n.setAttribute(k, attrs[k]);
      });
    }
    return n;
  }

  function makeInput(className, field, nodeId, value, placeholder) {
    const input = el("input", className, {
      type: "text",
      autocomplete: "off",
      autocorrect: "off",
      autocapitalize: "off",
      spellcheck: "false",
      enterkeyhint: "done"
    });
    input.dataset.field = field;
    if (nodeId) input.dataset.nodeId = nodeId;
    input.placeholder = placeholder;
    input.value = value || "";
    return input;
  }

  function buildNode(node, isRoot) {
    const wrap = el("div", "node" + (isRoot && node.type === "leaf" ? " root-leaf" : ""));
    wrap.dataset.nodeId = node.id;
    wrap.dataset.drop = node.type === "leaf" ? "leaf" : "hold";

    if (!isRoot) {
      wrap.appendChild(makeInput("feature-input", "feature", node.id, node.feature, "請輸入特徵"));
    }

    if (node.type === "leaf") {
      const box = el("div", "term-box");
      box.dataset.drop = "leaf";
      box.dataset.nodeId = node.id;
      const row = el("div", "node-avatars");
      const ids = avatarsIn("leaf", node.id);
      if (ids.length) fillAvatarRow(row, ids);
      else {
        const hint = el("div", "drop-hint", { text: "拖入頭像" });
        row.appendChild(hint);
      }
      box.appendChild(row);
      if (!isRoot) {
        box.appendChild(makeInput("name-input", "name", node.id, node.name, "請輸入名稱"));
      }
      wrap.appendChild(box);
      const btn = el("button", "btn-split", { type: "button", text: "分成兩組" });
      btn.dataset.action = "split";
      btn.dataset.nodeId = node.id;
      wrap.appendChild(btn);
    } else {
      const pending = avatarsIn("hold", node.id);
      if (pending.length) {
        const hold = el("div", "hold-box");
        hold.dataset.drop = "hold";
        hold.dataset.nodeId = node.id;
        const label = el("div", "hold-label");
        label.textContent = "尚未分入下面兩組（請拖入其中一組）";
        hold.appendChild(label);
        const row = el("div", "hold-avatars");
        fillAvatarRow(row, pending);
        hold.appendChild(row);
        wrap.appendChild(hold);
      }
      const canUnsplit = node.left.type === "leaf" && node.right.type === "leaf";
      // Always keep a drop target at this level: the hold box if avatars are
      // waiting, otherwise a slim control row (also hosts 取消這層).
      if (canUnsplit || pending.length === 0) {
        const controls = el("div", "branch-controls");
        controls.dataset.drop = "hold";
        controls.dataset.nodeId = node.id;
        controls.setAttribute("aria-label", "可暫放尚未分組的頭像");
        if (canUnsplit) {
          const un = el("button", "btn-unsplit", { type: "button", text: "取消這層" });
          un.dataset.action = "unsplit";
          un.dataset.nodeId = node.id;
          controls.appendChild(un);
        }
        wrap.appendChild(controls);
      }
    }
    return wrap;
  }

  let nodeEls = {};
  let titleEl = null;
  let contentW = 400;
  let contentH = 300;

  function rebuildTree() {
    const inner = els.inner;
    inner.textContent = "";
    nodeEls = {};

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "tree-svg");
    svg.setAttribute("aria-hidden", "true");
    inner.appendChild(svg);

    titleEl = el("div", "tree-title");
    titleEl.appendChild(makeInput(null, "title", null, state.title, "請輸入標題"));
    inner.appendChild(titleEl);

    function add(node, isRoot) {
      const n = buildNode(node, isRoot);
      inner.appendChild(n);
      nodeEls[node.id] = n;
      if (node.type === "branch") {
        add(node.left, false);
        add(node.right, false);
      }
    }
    add(state.root, true);

    autosizeAll();
    layoutTree();
  }

  function autosizeInput(input) {
    if (!input) return;
    const isTitle = input.dataset.field === "title";
    const min = isTitle ? 160 : (input.dataset.field === "name" ? 112 : 136);
    const max = isTitle ? 640 : 280;
    const style = window.getComputedStyle(input);
    const canvas = autosizeInput._c || (autosizeInput._c = document.createElement("canvas"));
    const ctx = canvas.getContext("2d");
    ctx.font = style.font;
    const text = input.value || input.placeholder || "";
    const w = Math.ceil(ctx.measureText(text).width + 28);
    input.style.width = Math.max(min, Math.min(max, w)) + "px";
  }

  function autosizeAll() {
    els.inner.querySelectorAll("input").forEach(autosizeInput);
  }

  function layoutTree() {
    const padX = LAYOUT.padX;
    const padY = LAYOUT.padY;

    function measure(node) {
      const eln = nodeEls[node.id];
      const w = Math.max(eln.offsetWidth, node.type === "leaf" ? LAYOUT.minLeaf : 0);
      const h = eln.offsetHeight;
      node._hw = w;
      node._hh = h;
      if (node.type === "leaf") {
        node._sw = w;
        node._sh = h;
      } else {
        measure(node.left);
        measure(node.right);
        node._sw = node.left._sw + LAYOUT.hGap + node.right._sw;
        node._sh = h + LAYOUT.vGap + Math.max(node.left._sh, node.right._sh);
      }
    }
    measure(state.root);

    const titleW = Math.max(titleEl.offsetWidth, 200);
    const titleH = Math.max(titleEl.offsetHeight, LAYOUT.titleH);
    const treeW = Math.max(state.root._sw, titleW);
    const treeH = titleH + LAYOUT.vGap + state.root._sh;
    contentW = Math.ceil(treeW + padX * 2);
    contentH = Math.ceil(treeH + padY * 2);

    const titleLeft = padX + (treeW - titleEl.offsetWidth) / 2;
    titleEl.style.left = Math.round(titleLeft) + "px";
    titleEl.style.top = padY + "px";

    function place(node, left, top) {
      node._x = left + node._sw / 2;
      node._y = top;
      const eln = nodeEls[node.id];
      eln.style.left = Math.round(node._x - eln.offsetWidth / 2) + "px";
      eln.style.top = Math.round(top) + "px";
      if (node.type === "branch") {
        const childTop = top + node._hh + LAYOUT.vGap;
        place(node.left, left, childTop);
        place(node.right, left + node.left._sw + LAYOUT.hGap, childTop);
      }
    }
    const rootLeft = padX + (treeW - state.root._sw) / 2;
    const rootTop = padY + titleH + LAYOUT.vGap;
    place(state.root, rootLeft, rootTop);

    els.inner.style.width = contentW + "px";
    els.inner.style.height = contentH + "px";
    els.scaler.style.width = contentW + "px";
    els.scaler.style.height = contentH + "px";
    applyScale();
    drawLines(titleH, padY);
  }

  function applyScale() {
    const s = state.scale;
    els.scaler.style.transform = "scale(" + s + ")";
    els.sizer.style.width = Math.ceil(contentW * s) + "px";
    els.sizer.style.height = Math.ceil(contentH * s) + "px";
    const pct = Math.round(s * 100) + "%";
    els.btnZoomReset.textContent = pct;
    els.btnZoomReset.setAttribute("title", "重設為 100%（目前 " + pct + "）");
  }

  function localBox(eln) {
    const ir = els.inner.getBoundingClientRect();
    const r = eln.getBoundingClientRect();
    const s = state.scale || 1;
    const x = (r.left - ir.left) / s;
    const y = (r.top - ir.top) / s;
    const w = r.width / s;
    const h = r.height / s;
    return { x: x, y: y, w: w, h: h, cx: x + w / 2, top: y, bottom: y + h };
  }

  function parts(node) {
    const wrap = nodeEls[node.id];
    return {
      wrap: wrap,
      feature: wrap.querySelector(".feature-input"),
      box: wrap.querySelector(".term-box"),
      hold: wrap.querySelector(".hold-box"),
      controls: wrap.querySelector(".branch-controls")
    };
  }

  function drawLines(titleH, padY) {
    const svg = els.inner.querySelector(".tree-svg");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("width", String(contentW));
    svg.setAttribute("height", String(contentH));
    svg.setAttribute("viewBox", "0 0 " + contentW + " " + contentH);

    const ns = "http://www.w3.org/2000/svg";
    function path(d) {
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", "#222222");
      p.setAttribute("stroke-width", "2");
      p.setAttribute("stroke-linecap", "square");
      p.setAttribute("stroke-linejoin", "miter");
      svg.appendChild(p);
    }
    function vline(x, y1, y2) {
      if (y2 - y1 < 1) return;
      path("M " + x + " " + y1 + " L " + x + " " + y2);
    }

    function firstAnchor(node) {
      const p = parts(node);
      const eln = p.feature || p.hold || p.box || p.controls || p.wrap;
      return localBox(eln);
    }
    function lastHead(node) {
      const p = parts(node);
      const eln = p.controls || p.hold || p.box || p.feature || p.wrap;
      return localBox(eln);
    }

    function internals(node) {
      const p = parts(node);
      const chain = [p.feature, p.hold, p.box || p.controls].filter(Boolean);
      for (let i = 0; i < chain.length - 1; i++) {
        const a = localBox(chain[i]);
        const b = localBox(chain[i + 1]);
        const x = (a.cx + b.cx) / 2;
        vline(x, a.bottom, b.top);
      }
    }

    const tb = localBox(titleEl);
    const ra = firstAnchor(state.root);
    vline(tb.cx, tb.bottom, ra.top);
    internals(state.root);

    function connect(node) {
      internals(node);
      if (node.type !== "branch") return;
      const hb = lastHead(node);
      const la = firstAnchor(node.left);
      const ra2 = firstAnchor(node.right);
      const barY = hb.bottom + LAYOUT.stub;
      path(
        "M " + hb.cx + " " + hb.bottom +
        " L " + hb.cx + " " + barY +
        " L " + la.cx + " " + barY +
        " M " + hb.cx + " " + barY +
        " L " + ra2.cx + " " + barY +
        " M " + la.cx + " " + barY +
        " L " + la.cx + " " + la.top +
        " M " + ra2.cx + " " + barY +
        " L " + ra2.cx + " " + ra2.top
      );
      connect(node.left);
      connect(node.right);
    }
    if (state.root.type === "branch") connect(state.root);
    else internals(state.root);
  }

  function renderAll() {
    renderTray();
    rebuildTree();
  }

  /* ---------- split / unsplit / text ---------- */
  let lastSplitAt = 0;

  function splitNode(id) {
    const node = findNode(id);
    if (!node || node.type !== "leaf") return;
    const pending = avatarsIn("leaf", node.id);
    node.type = "branch";
    node.left = createLeaf();
    node.right = createLeaf();
    delete node.name;
    delete node.avatars;
    pending.forEach(function (aid) {
      state.locations[aid] = { type: "hold", nodeId: node.id };
    });
    renderAll();
  }

  function unsplitNode(id) {
    const node = findNode(id);
    if (!node || node.type !== "branch") return;
    if (node.left.type !== "leaf" || node.right.type !== "leaf") return;
    const gathered = []
      .concat(avatarsIn("hold", node.id))
      .concat(avatarsIn("leaf", node.left.id))
      .concat(avatarsIn("leaf", node.right.id));
    node.type = "leaf";
    node.name = "";
    delete node.left;
    delete node.right;
    gathered.forEach(function (aid) {
      state.locations[aid] = { type: "leaf", nodeId: node.id };
    });
    renderAll();
  }

  function setText(field, nodeId, value) {
    if (field === "title") {
      state.title = value;
      return;
    }
    const node = findNode(nodeId);
    if (!node) return;
    if (field === "feature" || field === "name") node[field] = value;
  }

  /* ---------- drag ---------- */
  let drag = null;

  function zoneFromPoint(x, y) {
    if (drag) els.ghost.style.visibility = "hidden";
    const stack = document.elementsFromPoint(x, y);
    if (drag) els.ghost.style.visibility = "visible";
    for (let i = 0; i < stack.length; i++) {
      const n = stack[i].closest ? stack[i].closest("[data-drop]") : null;
      if (n) {
        if (n.dataset.drop === "tray") return { type: "tray", el: n };
        return { type: n.dataset.drop, nodeId: n.dataset.nodeId, el: n };
      }
    }
    return null;
  }

  function clearTargets() {
    document.querySelectorAll(".is-target").forEach(function (n) {
      n.classList.remove("is-target");
    });
  }

  function highlightZone(zone) {
    clearTargets();
    if (zone && zone.el) zone.el.classList.add("is-target");
    else if (zone && zone.type === "tray") els.tray.classList.add("is-target");
  }

  function placeAvatar(avatarId, target) {
    const id = String(avatarId);
    if (!(id in state.locations)) return false;
    if (!target) return false;
    if (target.type === "tray") {
      state.locations[id] = { type: "tray" };
      return true;
    }
    if (target.type === "leaf" || target.type === "hold") {
      const node = findNode(target.nodeId);
      if (!node) return false;
      if (target.type === "leaf" && node.type !== "leaf") return false;
      if (target.type === "hold" && node.type !== "branch") return false;
      state.locations[id] = { type: target.type, nodeId: target.nodeId };
      return true;
    }
    return false;
  }

  function onPointerDown(e) {
    const btn = e.target.closest && e.target.closest(".avatar");
    if (!btn) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const id = btn.dataset.avatarId;
    const rect = btn.getBoundingClientRect();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    drag = {
      id: id,
      pointerId: e.pointerId,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      w: rect.width,
      h: rect.height,
      moved: false,
      startX: e.clientX,
      startY: e.clientY
    };
    btn.classList.add("is-dragging");
    els.ghost.hidden = false;
    els.ghost.className = "drag-ghost" + (String(id) === CROWNED_ID ? " has-crown" : "");
    els.ghost.style.width = "";
    els.ghost.style.height = "";
    els.ghost.innerHTML = "";
    appendAvatarVisual(els.ghost, id);
    moveGhost(e.clientX, e.clientY);
  }

  function moveGhost(cx, cy) {
    els.ghost.style.left = (cx - drag.offsetX) + "px";
    els.ghost.style.top = (cy - drag.offsetY) + "px";
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    e.preventDefault();
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (dx * dx + dy * dy > 9) drag.moved = true;
    }
    moveGhost(e.clientX, e.clientY);
    highlightZone(zoneFromPoint(e.clientX, e.clientY));
  }

  function onPointerUp(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const zone = zoneFromPoint(e.clientX, e.clientY);
    const id = drag.id;
    const src = document.querySelector('.avatar.is-dragging');
    if (src) src.classList.remove("is-dragging");
    els.ghost.hidden = true;
    els.ghost.innerHTML = "";
    clearTargets();
    drag = null;
    if (zone) {
      if (placeAvatar(id, zone)) renderAll();
    }
  }

  function onPointerCancel(e) {
    if (!drag || (e.pointerId && e.pointerId !== drag.pointerId)) return;
    const src = document.querySelector('.avatar.is-dragging');
    if (src) src.classList.remove("is-dragging");
    els.ghost.hidden = true;
    els.ghost.innerHTML = "";
    clearTargets();
    drag = null;
  }

  document.addEventListener("pointerdown", onPointerDown, { passive: false });
  document.addEventListener("pointermove", onPointerMove, { passive: false });
  document.addEventListener("pointerup", onPointerUp, { passive: false });
  document.addEventListener("pointercancel", onPointerCancel, { passive: false });

  /* ---------- clicks / input ---------- */
  document.addEventListener("click", function (e) {
    const split = e.target.closest && e.target.closest("[data-action=split]");
    if (split) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastSplitAt < SPLIT_DEBOUNCE_MS) return;
      lastSplitAt = now;
      splitNode(split.dataset.nodeId);
      return;
    }
    const un = e.target.closest && e.target.closest("[data-action=unsplit]");
    if (un) {
      e.preventDefault();
      const now = Date.now();
      if (now - lastSplitAt < SPLIT_DEBOUNCE_MS) return;
      lastSplitAt = now;
      unsplitNode(un.dataset.nodeId);
    }
  });

  let layoutTimer = 0;
  document.addEventListener("input", function (e) {
    const t = e.target;
    if (!t || !t.dataset || !t.dataset.field) return;
    setText(t.dataset.field, t.dataset.nodeId, t.value);
    autosizeInput(t);
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(layoutTree, 60);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.tagName === "INPUT") {
      e.preventDefault();
      e.target.blur();
    }
  });

  els.btnReset.addEventListener("click", function () {
    const ok = window.confirm("確定要重設嗎？所有頭像會放回上方，分層和已輸入的文字都會清除。");
    if (!ok) return;
    resetState();
    renderAll();
  });

  function clampScale(s) {
    return Math.max(MIN_SCALE, Math.min(MAX_SCALE, Math.round(s * 100) / 100));
  }
  function setScale(s, fitCenter) {
    const prev = state.scale;
    state.scale = clampScale(s);
    applyScale();
    if (fitCenter) {
      const vp = els.viewport;
      vp.scrollLeft = Math.max(0, (els.sizer.offsetWidth - vp.clientWidth) / 2);
      vp.scrollTop = 0;
    } else if (prev !== state.scale) {
      // keep viewport roughly stable; no fancy focal zoom for button clicks
    }
  }
  els.btnZoomIn.addEventListener("click", function () { setScale(state.scale + SCALE_STEP); });
  els.btnZoomOut.addEventListener("click", function () { setScale(state.scale - SCALE_STEP); });
  els.btnZoomReset.addEventListener("click", function () { setScale(1); });
  els.btnZoomFit.addEventListener("click", function () {
    const vp = els.viewport;
    const availW = Math.max(120, vp.clientWidth - 16);
    const availH = Math.max(120, vp.clientHeight - 16);
    const sx = availW / contentW;
    const sy = availH / contentH;
    setScale(Math.min(1, sx, sy), true);
  });

  els.viewport.addEventListener("wheel", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -SCALE_STEP : SCALE_STEP;
    setScale(state.scale + delta);
  }, { passive: false });

  /* pinch zoom on the tree */
  const pinch = { active: false, startDist: 0, startScale: 1 };
  function dist(a, b) {
    const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  const pinchPointers = new Map();
  els.viewport.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest(".avatar")) return;
    pinchPointers.set(e.pointerId, e);
    if (pinchPointers.size === 2) {
      const pts = Array.from(pinchPointers.values());
      pinch.active = true;
      pinch.startDist = dist(pts[0], pts[1]) || 1;
      pinch.startScale = state.scale;
    }
  });
  els.viewport.addEventListener("pointermove", function (e) {
    if (!pinchPointers.has(e.pointerId)) return;
    pinchPointers.set(e.pointerId, e);
    if (pinch.active && pinchPointers.size >= 2) {
      const pts = Array.from(pinchPointers.values());
      const d = dist(pts[0], pts[1]);
      if (d > 0 && pinch.startDist > 0) {
        setScale(pinch.startScale * (d / pinch.startDist));
      }
    }
  });
  function endPinchPtr(e) {
    pinchPointers.delete(e.pointerId);
    if (pinchPointers.size < 2) pinch.active = false;
  }
  els.viewport.addEventListener("pointerup", endPinchPtr);
  els.viewport.addEventListener("pointercancel", endPinchPtr);

  window.addEventListener("resize", function () {
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(layoutTree, 80);
  });

  /* ---------- public test hook ---------- */
  window.__keySim = {
    reset: function () { resetState(); renderAll(); },
    addSplit: function (nodeId) { splitNode(nodeId || state.root.id); },
    undoSplit: function (nodeId) { unsplitNode(nodeId); },
    getState: function () {
      return JSON.parse(JSON.stringify({
        title: state.title,
        root: state.root,
        locations: state.locations,
        scale: state.scale,
        rootId: state.root.id
      }));
    },
    placeAvatar: function (avatarId, target) {
      const ok = placeAvatar(avatarId, target);
      if (ok) renderAll();
      return ok;
    },
    setScale: setScale,
    render: renderAll,
    findNode: function (id) { return findNode(id); }
  };

  renderAll();
})();
</script>
</body>
</html>
