function isSnapped(c) {
  if (!c || !c.a || !c.b || c.a === c.b) return false;
  const pa = getPost(c.a), pb = getPost(c.b);
  return !!(pa && pb && areAdjacentPosts(pa, pb));
}

function getCircuitHints() {
  const items = [];
  const pieces = state.pieces;
  if (!pieces.length) {
    return [
      '底板尚未有元件。',
      '請先裝上電池和燈泡，以導片連接金屬柱，再繪畫電路圖。'
    ];
  }

  const nBat = pieces.filter(p => p.type === 'battery').length;
  const nBulb = pieces.filter(p => p.type === 'bulb').length;
  const nSw = pieces.filter(p => p.type === 'switch').length;
  const nStrip = pieces.filter(p => p.type === 'strip').length;
  const parts = [];
  if (nBat) parts.push('電池 ' + nBat + ' 個');
  if (nBulb) parts.push('燈泡 ' + nBulb + ' 個');
  if (nSw) parts.push('開關 ' + nSw + ' 個');
  if (nStrip) parts.push('導片 ' + nStrip + ' 條');
  items.push('現有：' + parts.join('、') + '。');

  const loose = pieces.filter(p => !isSnapped(p));
  if (loose.length) {
    const looseTypes = { battery: 0, bulb: 0, switch: 0, strip: 0 };
    loose.forEach(p => { if (looseTypes[p.type] != null) looseTypes[p.type]++; });
    const names = [];
    if (looseTypes.battery) names.push('電池');
    if (looseTypes.bulb) names.push('燈泡');
    if (looseTypes.switch) names.push('開關');
    if (looseTypes.strip) names.push('導片');
    items.push('有 ' + loose.length + ' 件元件未接上金屬柱（' + names.join('、') + '）。請先扣緊兩端。');
  }

  if (nBat === 0) {
    items.push('尚未加入電池。繪圖須由電池開始（長線為＋，短線為－）。');
  } else {
    const batLoose = pieces.filter(p => p.type === 'battery' && !isSnapped(p)).length;
    if (batLoose === nBat) {
      items.push('電池尚未接好。請將兩端扣上金屬柱（長線為＋，短線為－）。');
    } else if (batLoose) {
      items.push('部分電池尚未接好，請先扣緊兩端。');
    }
  }

  if (nBulb === 0) {
    items.push('尚未加入燈泡。');
  } else if (pieces.some(p => p.type === 'bulb' && !isSnapped(p))) {
    items.push('部分燈泡尚未接好，無法形成回路。');
  }

  const openSw = pieces.filter(p => p.type === 'switch' && !p.closed);
  if (nSw && openSw.length === nSw) {
    items.push('開關全部斷開。請先合上開關。');
  } else if (openSw.length) {
    items.push('有 ' + openSw.length + ' 個開關斷開，電流會在該處中斷。');
  }

  if (nBat && nBulb) {
    const lit = pieces.filter(p => p.type === 'bulb' && litBulbs.has(p.uid)).length;
    if (lit > 0) {
      items.push('回路已閉合（' + lit + ' 盞燈發亮）。請由電池＋極開始，沿回路以符號表示各元件。');
      items.push('導線須畫成橫線和直線。三條或以上導線相交時，才加上實心點。');
    } else {
      items.push('燈泡未亮，回路尚未閉合。請由電池＋極沿電路檢查何處中斷。');
      if (openSw.length) {
        items.push('請先檢查已斷開的開關。');
      } else if (nStrip === 0) {
        items.push('尚未加入導片。請用導片連接電池和燈泡。');
      }
    }
  } else if (nBat && !nBulb) {
    items.push('已有電池，但尚未加入燈泡。');
  }

  return items;
}

function renderHintBox() {
  const box = document.getElementById('schem-hint-box');
  if (!box) return;
  if (!state.showSchemHint) {
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  box.classList.add('show');
  const items = getCircuitHints();
  const kicker = '<p class="hint-kicker">根據目前電路（不顯示完整答案）</p>';
  box.innerHTML = kicker + '<ol>' + items.map(t => '<li>' + t + '</li>').join('') + '</ol>';
}

function syncSchematicPanel() {
  const open = state.showSchematic || state.showSchemHint;
  schematicPanel.classList.toggle('visible', open);
  schematicPanel.classList.toggle('hint-only', state.showSchemHint && !state.showSchematic);
  schematicPanel.classList.toggle('with-both', state.showSchemHint && state.showSchematic);
  schematicPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
  const title = schematicPanel.querySelector('h2');
  if (title) {
    if (state.showSchematic && state.showSchemHint) title.textContent = '電路圖（含提示）';
    else if (state.showSchemHint && !state.showSchematic) title.textContent = '電路圖提示';
    else title.textContent = '電路圖';
  }
  btnSchematic.textContent = state.showSchematic ? '隱藏電路圖' : '顯示電路圖';
  btnSchematic.classList.toggle('show-on', state.showSchematic);
  btnSchemHint.textContent = state.showSchemHint ? '隱藏電路圖提示' : '顯示電路圖提示';
  btnSchemHint.classList.toggle('show-on', state.showSchemHint);
  if (state.showSchemHint) renderHintBox();
  else {
    const box = document.getElementById('schem-hint-box');
    if (box) { box.classList.remove('show'); box.innerHTML = ''; }
  }
  if (schemWrap) {
    schemWrap.style.display = state.showSchematic ? 'flex' : 'none';
  }
  if (state.showSchematic) scheduleSchematicResize();
}

const schemAskModal = document.getElementById('schem-ask-modal');

function openSchemAskModal() {
  schemAskModal.classList.add('open');
  schemAskModal.setAttribute('aria-hidden', 'false');
}

function closeSchemAskModal() {
  schemAskModal.classList.remove('open');
  schemAskModal.setAttribute('aria-hidden', 'true');
}

function revealSchematic() {
  state.showSchematic = true;
  syncSchematicPanel();
}

btnSchematic.addEventListener('click', () => {
  if (state.showSchematic) {
    state.showSchematic = false;
    syncSchematicPanel();
    return;
  }
  openSchemAskModal();
});

document.getElementById('schem-ask-yes').addEventListener('click', () => {
  closeSchemAskModal();
  revealSchematic();
});
document.getElementById('schem-ask-no').addEventListener('click', () => {
  closeSchemAskModal();
  setStatus('請先自行繪畫電路圖，再按顯示核對。');
});
schemAskModal.addEventListener('click', (e) => {
  if (e.target === schemAskModal) closeSchemAskModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && schemAskModal.classList.contains('open')) {
    e.preventDefault();
    closeSchemAskModal();
  }
});

const hintPwModal = document.getElementById('hint-pw-modal');
const hintPwInput = document.getElementById('hint-pw-input');
const hintPwErr = document.getElementById('hint-pw-err');

function openHintPassword() {
  hintPwInput.value = '';
  hintPwErr.hidden = true;
  hintPwModal.classList.add('open');
  hintPwModal.setAttribute('aria-hidden', 'false');
  setTimeout(() => hintPwInput.focus(), 50);
}

function closeHintPassword() {
  hintPwModal.classList.remove('open');
  hintPwModal.setAttribute('aria-hidden', 'true');
  hintPwInput.value = '';
  hintPwErr.hidden = true;
}

function submitHintPassword() {
  const val = (hintPwInput.value || '').trim();
  if (val === HINT_PASSWORD) {
    state.hintUnlocked = true;
    state.showSchemHint = true;
    closeHintPassword();
    syncSchematicPanel();
    setStatus('已解鎖電路圖提示');
    return;
  }
  hintPwErr.hidden = false;
  hintPwInput.value = '';
  hintPwInput.focus();
}

btnSchemHint.addEventListener('click', () => {
  if (state.showSchemHint) {
    state.showSchemHint = false;
    syncSchematicPanel();
    return;
  }
  if (state.hintUnlocked) {
    state.showSchemHint = true;
    syncSchematicPanel();
    return;
  }
  openHintPassword();
});

document.getElementById('hint-pw-ok').addEventListener('click', submitHintPassword);
document.getElementById('hint-pw-cancel').addEventListener('click', closeHintPassword);
hintPwInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitHintPassword(); }
  if (e.key === 'Escape') { e.preventDefault(); closeHintPassword(); }
});
hintPwModal.addEventListener('click', (e) => {
  if (e.target === hintPwModal) closeHintPassword();
});

function onResize() {
  layoutPosts();
  // re-align snapped pieces to new post positions
  state.pieces.forEach(p => {
    if (p.a && p.b) alignPieceToPosts(p);
  });
  renderPieces();
  updateCircuit();
  resizeSchematic();
}

window.addEventListener('resize', () => {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(onResize, 80);
});

document.addEventListener('selectstart', (e) => {
  if (isHardDrag() || e.target.closest('.piece, .palette-item, .rot-handle, .sw-handle')) e.preventDefault();
});
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.palette-item, .piece, .rot-handle, .sw-handle')) e.preventDefault();
});
document.addEventListener('keydown', (e) => {
  if (!state.selected) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deletePiece(state.selected); }
});

layoutPosts();
renderPalette();
updateEmpty();
setStatus('就緒 —— 5×5 底板 · 元件一格長 · 長按拖出');
})();
</script>
</body>
</html>
