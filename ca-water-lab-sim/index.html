<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>鈣與水（收集氣體）五件套 — 互動模擬</title>
<style>
:root {
  --bg: #f3efe6;
  --panel: #fffdf8;
  --ink: #1c1c1c;
  --muted: #5c5c5c;
  --accent: #245a96;
  --accent-soft: #e7eef8;
  --border: #c4bdb0;
  --canvas: #fffcf5;
  --danger: #a31818;
  --hit: 48px;
  --palette-w: 132px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  height: -webkit-fill-available;
}
html, body {
  margin: 0; padding: 0;
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  overflow: hidden;
  padding-top: var(--safe-t);
  padding-right: var(--safe-r);
  padding-bottom: var(--safe-b);
  padding-left: var(--safe-l);
}
body.drag-lock {
  /* 只喺確認拖曳後加；唔用 position:fixed，避免 iOS 捲動錯亂 */
  touch-action: none;
}
header {
  flex-shrink: 0;
  background: #243746;
  color: #fff;
  padding: 8px 12px 10px;
}
header h1 { margin: 0 0 3px; font-size: 1.05rem; font-weight: 700; }
header p { margin: 0; font-size: 0.82rem; line-height: 1.4; opacity: 0.95; }
header .tip {
  margin-top: 5px; font-size: 0.72rem; opacity: 0.92;
  background: rgba(255,255,255,0.12); display: inline-block;
  padding: 2px 9px; border-radius: 999px;
}
.toolbar {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.toolbar .spacer { flex: 1; min-width: 6px; }
button {
  appearance: none; -webkit-appearance: none;
  border: 1px solid var(--border); background: #fff;
  color: var(--ink); border-radius: 10px; padding: 9px 12px;
  font-size: 0.9rem; font-family: inherit;
  min-height: var(--hit); min-width: var(--hit);
  touch-action: manipulation; cursor: pointer;
}
button:active { background: var(--accent-soft); transform: scale(0.97); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--danger); border-color: #e0b0b0; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: row;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

/* ===== 橫屏：窄左欄，一定可垂直 scroll ===== */
.palette {
  flex: 0 0 var(--palette-w);
  width: var(--palette-w);
  max-width: var(--palette-w);
  min-width: 0;
  min-height: 0;
  align-self: stretch;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 6px 4px 10px;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
  /* 唔用 pointer-events 擋 scroll */
}
.palette h2 {
  margin: 0 0 6px; font-size: 0.7rem; color: var(--muted); font-weight: 600;
  padding: 0 3px; line-height: 1.25;
}
.palette-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding-bottom: 40px; /* 保證內容高過欄 → 一定可捲 */
}
.palette-item {
  border: 1.5px dashed var(--border);
  border-radius: 9px;
  background: #fffcf5;
  padding: 5px 2px 4px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  touch-action: pan-y; /* 閒置只准垂直捲 */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 88px;
  flex-shrink: 0;
  cursor: grab;
}
.palette-item.armed {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 2px rgba(36,90,150,0.25);
}
.palette-item.dragging-src {
  opacity: 0.35;
  touch-action: none;
}
.palette-item.used {
  opacity: 0.4; cursor: not-allowed; border-style: solid;
}
.palette-item .thumb {
  width: 100%; height: 48px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; overflow: hidden;
}
.palette-item .thumb svg {
  max-width: 96%; max-height: 46px; width: auto; height: auto; display: block;
}
.palette-item .label {
  font-size: 0.68rem; font-weight: 700; text-align: center; line-height: 1.15;
}
.palette-item .hint {
  font-size: 0.58rem; color: var(--muted); text-align: center;
}

.workspace {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
  padding: 8px; gap: 6px;
  overflow: hidden;
}
.canvas-label {
  flex-shrink: 0;
  font-size: 0.8rem; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.canvas {
  flex: 1 1 auto;
  position: relative;
  min-height: 240px;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
    var(--canvas);
  background-size: 26px 26px, 26px 26px, auto;
  border: 2px solid var(--border);
  border-radius: 12px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: none; /* 畫布本身用手拖儀器，唔跟系統手勢搶 */
  overscroll-behavior: contain;
}
.canvas.empty::after {
  content: "由左欄長按儀器，再拖入畫布組裝（對齊手繪裝置）";
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: #9a9488; font-size: 0.95rem; pointer-events: none;
  padding: 24px; text-align: center;
}
.selection-bar {
  flex-shrink: 0;
  display: none;
  flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 6px 4px;
}
.selection-bar.show { display: flex; }
.selection-bar .name { font-weight: 700; font-size: 0.9rem; }
.selection-bar .deg { min-width: 3.2em; font-weight: 700; color: #1a3a6a; }

footer {
  flex-shrink: 0;
  font-size: 0.72rem; color: var(--muted);
  padding: 6px 12px 8px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

/* 直屏／窄屏：上方橫列，可橫向 scroll */
@media (max-width: 1100px) and (orientation: portrait), (max-width: 820px) {
  .main { flex-direction: column; }
  .palette {
    flex: 0 0 auto;
    width: 100%;
    max-width: none;
    height: 148px;
    max-height: 148px;
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    touch-action: pan-x;
    padding: 6px 8px 8px;
  }
  .palette-list {
    flex-direction: row;
    padding-bottom: 0;
    padding-right: 28px;
    width: max-content;
  }
  .palette-item {
    width: 100px;
    min-height: 110px;
    touch-action: pan-x;
  }
  .palette-item .thumb { height: 54px; }
}

.piece {
  position: absolute;
  left: 0; top: 0;
  transform-origin: center center;
  will-change: transform, left, top;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.piece .piece-body {
  position: relative;
  touch-action: none;
  cursor: grab;
}
.piece.selected .piece-body {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
.piece.dragging { opacity: 0.92; z-index: 5000 !important; }
.piece .piece-body svg { display: block; pointer-events: none; }

.rot-handle {
  position: absolute;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #111;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  display: none;
  align-items: center; justify-content: center;
  touch-action: none;
  cursor: grab;
  z-index: 6000;
  left: 50%;
  top: -58px;
  margin-left: -23px;
}
.piece.selected .rot-handle { display: flex; }
.rot-handle svg { width: 28px; height: 28px; pointer-events: none; }
.rot-handle.dragging { background: var(--accent-soft); cursor: grabbing; }

.ghost {
  position: fixed;
  pointer-events: none;
  z-index: 8000;
  opacity: 0.88;
  left: 0; top: 0;
}

.ctx-menu {
  display: none;
  position: fixed;
  z-index: 9000;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  min-width: 150px;
  overflow: hidden;
}
.ctx-menu button {
  display: block; width: 100%;
  border: none; border-radius: 0;
  text-align: left; padding: 12px 14px;
  border-bottom: 1px solid #eee;
}
.ctx-menu button:last-child { border-bottom: none; }

@media print {
  header .tip, .toolbar, .palette, .selection-bar, footer, .ctx-menu, .rot-handle { display: none !important; }
  .main { display: block; }
  .canvas { border: none; overflow: visible; min-height: auto; }
  body { overflow: visible; }
}
</style>
</head>
<body>
<header>
  <h1>鈣與水反應（收集氣體）— 五件套裝</h1>
  <p>只用五件：大燒杯、試管、膠塞、漏斗、鈣粒。組裝切面裝置收集產生嘅氫氣。</p>
  <span class="tip">儀器欄：大燒杯×1 · 試管×1 · 膠塞×1 · 漏斗×1 · 鈣粒×1｜長按拖出 · 點選旋轉</span>
</header>

<div class="toolbar">
  <button type="button" id="btn-reset" title="清空畫布">重置畫布</button>
  <button type="button" id="btn-print" class="primary" title="列印">列印／匯出</button>
  <span class="spacer"></span>
  <span id="status" style="font-size:0.8rem;color:var(--muted);"></span>
</div>

<div class="main">
  <aside class="palette" id="palette-aside" aria-label="儀器欄">
    <h2>五件套裝<br/>長按拖出 · 輕掃捲動</h2>
    <div class="palette-list" id="palette"></div>
  </aside>
  <div class="workspace">
    <div class="canvas-label">
      <span>畫布 — 自由拖放組裝（切面線稿）</span>
      <span>點選 → 彎箭頭旋轉 · 翻轉 180°</span>
    </div>
    <div class="canvas empty" id="canvas" role="application" aria-label="實驗裝置畫布"></div>
    <div class="selection-bar" id="sel-bar">
      <span class="name" id="sel-name">—</span>
      <span class="deg" id="sel-deg">0°</span>
      <button type="button" id="btn-flip">翻轉 180°</button>
      <button type="button" id="btn-front">最前</button>
      <button type="button" id="btn-back">最後</button>
      <button type="button" id="btn-delete" class="danger">刪除</button>
    </div>
  </div>
</div>

<footer>五件套：大燒杯、試管、膠塞、漏斗、鈣粒。比較組裝設計並收集氣體。｜離線／iPad｜Ms So 化學課</footer>

<div class="ctx-menu" id="ctx-menu" role="menu">
  <button type="button" data-act="flip">翻轉 180°</button>
  <button type="button" data-act="front">移到最前</button>
  <button type="button" data-act="delete" style="color:var(--danger);">刪除</button>
</div>

<script>
/* ========== 切面線稿 SVG（對齊 instruments.png 開頂玻璃器） ========== */
const SVGS = {
  /* 水位約杯深 80%：倒轉漏斗尖可浸入水中 */
  beaker: `<svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" width="240" height="274">
  <path d="M40 64 L40 276 Q40 296 60 296 L220 296 Q240 296 240 276 L240 64 Z" fill="#c5daf0" stroke="none"/>
  <line x1="40" y1="64" x2="240" y2="64" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M40 22 L40 276 Q40 296 60 296 L220 296 Q240 296 240 276 L240 22" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 22 H52 M228 22 H254" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>
  <text x="140" y="314" text-anchor="middle" font-size="15" fill="#444" font-family="sans-serif">大燒杯</text>
</svg>`,

  tube: `<svg viewBox="0 0 60 200" xmlns="http://www.w3.org/2000/svg" width="44" height="148">
  <path d="M16 8 L16 164 Q16 186 30 186 Q44 186 44 164 L44 8" fill="#f2f7fb" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M11 8 H21 M39 8 H49" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="30" y="198" text-anchor="middle" font-size="12" fill="#444" font-family="sans-serif">試管</text>
</svg>`,

  funnel: `<svg viewBox="0 0 130 160" xmlns="http://www.w3.org/2000/svg" width="112" height="138">
  <path d="M12 14 L118 14 L72 82 L58 82 Z" fill="#f2f7fb" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M58 82 L58 142 Q58 148 65 148 Q72 148 72 142 L72 82" fill="#f2f7fb" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M8 14 H16 M114 14 H122" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="65" y="158" text-anchor="middle" font-size="12" fill="#444" font-family="sans-serif">漏斗</text>
</svg>`,

  bung: `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
  <!-- 梯形膠塞：闊度對齊試管內徑（試管內寬約 28 viewBox 單位／顯示約 20–22px；塞略闊可塞入口） -->
  <path d="M8 6 L32 6 L28 28 L12 28 Z" fill="#b0b0b0" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
  <g stroke="#1a1a1a" stroke-width="1.1" opacity="0.85">
    <line x1="12" y1="10" x2="15" y2="24"/><line x1="18" y1="9" x2="20" y2="24"/>
    <line x1="24" y1="9" x2="25" y2="24"/><line x1="28" y1="10" x2="27" y2="24"/>
  </g>
  <text x="20" y="38" text-anchor="middle" font-size="9" fill="#444" font-family="sans-serif">膠塞</text>
</svg>`,

  calcium: `<svg viewBox="0 0 90 70" xmlns="http://www.w3.org/2000/svg" width="68" height="52">
  <ellipse cx="34" cy="28" rx="14" ry="10" fill="#2a2a2a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="52" cy="24" rx="10" ry="8" fill="#3a3a3a" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="46" cy="38" rx="9" ry="7" fill="#222" stroke="#111" stroke-width="1.1"/>
  <circle cx="22" cy="40" r="3.2" fill="#333"/><circle cx="64" cy="36" r="2.8" fill="#2f2f2f"/>
  <text x="45" y="64" text-anchor="middle" font-size="12" fill="#444" font-family="sans-serif">鈣粒</text>
</svg>`
};

/* 基礎層級：大燒杯最底；試管永遠高過漏斗 */
const TYPE_Z = {
  beaker: 1, funnel: 5, bung: 6, calcium: 7, tube: 10
};

const INSTRUMENTS = [
  { id: 'beaker', name: '大燒杯', qty: 1, w: 240, h: 274, svg: SVGS.beaker },
  { id: 'tube', name: '試管', qty: 1, w: 44, h: 148, svg: SVGS.tube },
  { id: 'bung', name: '膠塞', qty: 1, w: 28, h: 28, svg: SVGS.bung },
  { id: 'funnel', name: '漏斗', qty: 1, w: 112, h: 138, svg: SVGS.funnel },
  { id: 'calcium', name: '鈣粒', qty: 1, w: 68, h: 52, svg: SVGS.calcium }
];

const ROT_ARROW = `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M 36.2 12.5 A 15.2 15.2 0 1 1 14.5 12.8" fill="none" stroke="#111" stroke-width="7" stroke-linecap="butt"/>
  <polygon points="30,5 42.5,12.2 29.5,18.5" fill="#111"/>
</svg>`;

const LONG_PRESS_MS = 320;
const MOVE_CANCEL_PX = 10;   /* 長按前移動超過呢個 → 當 scroll，取消 arm */
const CROSS_DRAG_PX = 18;    /* 垂直於捲動軸移動超過 → 直接拖出（免長按） */

const state = {
  pieces: [],
  selected: null,
  nextZ: 1,
  drag: null /* null | arm | palette | piece | rotate */
};

const canvas = document.getElementById('canvas');
const paletteEl = document.getElementById('palette');
const paletteAside = document.getElementById('palette-aside');
const selBar = document.getElementById('sel-bar');
const selName = document.getElementById('sel-name');
const selDeg = document.getElementById('sel-deg');
const ctxMenu = document.getElementById('ctx-menu');
const statusEl = document.getElementById('status');

function uid() { return 'p' + Math.random().toString(36).slice(2, 9); }
function findInst(type) { return INSTRUMENTS.find(i => i.id === type); }
function usedCount(type) { return state.pieces.filter(p => p.type === type).length; }

function isPortraitRow() {
  return window.matchMedia('(max-width: 1100px) and (orientation: portrait), (max-width: 820px)').matches;
}

function displayScale() {
  const w = Math.min(window.innerWidth || 800, document.documentElement.clientWidth || 800);
  if (w <= 420) return 0.55;
  if (w <= 700) return 0.72;
  if (w <= 900) return 0.88;
  if (w <= 1180) return 0.95;
  return 1;
}
function instSize(inst) {
  const s = displayScale();
  return { w: Math.round(inst.w * s), h: Math.round(inst.h * s) };
}

function ptrXY(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY, id: e.touches[0].identifier };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, id: e.changedTouches[0].identifier };
  return { x: e.clientX, y: e.clientY, id: e.pointerId };
}

function clientToCanvas(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: cx - r.left + canvas.scrollLeft, y: cy - r.top + canvas.scrollTop };
}

function isHardDrag() {
  const m = state.drag && state.drag.mode;
  return m === 'palette' || m === 'piece' || m === 'rotate';
}

function setDragLock(on) {
  document.body.classList.toggle('drag-lock', !!on);
  /* 動態掛／拆 non-passive touchmove，閒置時唔擋 palette scroll */
  if (on) {
    if (!_tmGuardOn) {
      document.addEventListener('touchmove', touchMoveGuard, { passive: false, capture: true });
      _tmGuardOn = true;
    }
  } else if (_tmGuardOn) {
    document.removeEventListener('touchmove', touchMoveGuard, { capture: true });
    _tmGuardOn = false;
  }
}
let _tmGuardOn = false;
function touchMoveGuard(e) {
  if (isHardDrag() && e.cancelable) e.preventDefault();
}

function setStatus(t) { statusEl.textContent = t || ''; }

function renderPalette() {
  paletteEl.innerHTML = '';
  INSTRUMENTS.forEach(inst => {
    const left = inst.qty - usedCount(inst.id);
    const div = document.createElement('div');
    div.className = 'palette-item' + (left <= 0 ? ' used' : '');
    div.dataset.type = inst.id;
    div.innerHTML = `<div class="thumb">${inst.svg}</div><div class="label">${inst.name}</div><div class="hint">餘 ${Math.max(0, left)}</div>`;
    if (left > 0) {
      div.addEventListener('pointerdown', onPaletteDown);
    }
    paletteEl.appendChild(div);
  });
}

function updateEmpty() {
  canvas.classList.toggle('empty', state.pieces.length === 0);
}

function updateSelBar() {
  const p = state.pieces.find(x => x.uid === state.selected);
  if (!p) {
    selBar.classList.remove('show');
    return;
  }
  selBar.classList.add('show');
  const inst = findInst(p.type);
  selName.textContent = inst ? inst.name : p.type;
  selDeg.textContent = Math.round(p.rot) + '°';
}

function pieceZ(p) {
  return ((TYPE_Z[p.type] || 0) * 1000) + (p.z || 0);
}

function renderPieces() {
  const keep = new Set(state.pieces.map(p => p.uid));
  [...canvas.querySelectorAll('.piece')].forEach(el => {
    if (!keep.has(el.dataset.uid)) el.remove();
  });
  state.pieces.forEach(p => {
    let el = canvas.querySelector('.piece[data-uid="' + p.uid + '"]');
    const inst = findInst(p.type);
    const sz = instSize(inst);
    if (!el) {
      el = document.createElement('div');
      el.className = 'piece';
      el.dataset.uid = p.uid;
      el.innerHTML = `<div class="piece-body"></div><div class="rot-handle" title="旋轉">${ROT_ARROW}</div>`;
      canvas.appendChild(el);
      const body = el.querySelector('.piece-body');
      body.addEventListener('pointerdown', onPieceDown);
      body.addEventListener('contextmenu', onPieceCtx);
      el.querySelector('.rot-handle').addEventListener('pointerdown', onRotDown);
    }
    const body = el.querySelector('.piece-body');
    body.style.width = sz.w + 'px';
    body.style.height = sz.h + 'px';
    body.innerHTML = inst.svg;
    const svg = body.querySelector('svg');
    if (svg) { svg.setAttribute('width', sz.w); svg.setAttribute('height', sz.h); }
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.zIndex = String(pieceZ(p));
    el.style.transform = 'rotate(' + p.rot + 'deg)';
    el.classList.toggle('selected', p.uid === state.selected);
    const handle = el.querySelector('.rot-handle');
    /* 手柄位置：喺旋轉後視覺上方，用反向旋轉保持直立 */
    handle.style.transform = 'rotate(' + (-p.rot) + 'deg)';
  });
  updateEmpty();
  updateSelBar();
  renderPalette();
}

function addPiece(type, x, y, rot) {
  const inst = findInst(type);
  if (!inst || usedCount(type) >= inst.qty) return null;
  const sz = instSize(inst);
  const p = {
    uid: uid(),
    type,
    x: Math.max(0, x),
    y: Math.max(0, y),
    rot: rot || 0,
    z: state.nextZ++
  };
  /* 限制喺畫布大概範圍 */
  const maxX = Math.max(0, canvas.clientWidth - sz.w);
  const maxY = Math.max(0, canvas.clientHeight - sz.h);
  p.x = Math.min(maxX, p.x);
  p.y = Math.min(maxY, p.y);
  state.pieces.push(p);
  state.selected = p.uid;
  renderPieces();
  setStatus('已放入「' + inst.name + '」');
  return p;
}

function selectPiece(uidVal) {
  state.selected = uidVal;
  renderPieces();
}

function deletePiece(uidVal) {
  state.pieces = state.pieces.filter(p => p.uid !== uidVal);
  if (state.selected === uidVal) state.selected = null;
  renderPieces();
}

function rotateSelected(delta) {
  const p = state.pieces.find(x => x.uid === state.selected);
  if (!p) return;
  p.rot = ((p.rot + delta) % 360 + 360) % 360;
  renderPieces();
}

function bringFront() {
  const p = state.pieces.find(x => x.uid === state.selected);
  if (!p) return;
  p.z = state.nextZ++;
  renderPieces();
}
function sendBack() {
  const p = state.pieces.find(x => x.uid === state.selected);
  if (!p) return;
  const minZ = Math.min(...state.pieces.map(x => x.z));
  p.z = minZ - 1;
  renderPieces();
}

function angleFromCenter(el, cx, cy) {
  const body = el.querySelector('.piece-body');
  const r = body.getBoundingClientRect();
  const ox = r.left + r.width / 2;
  const oy = r.top + r.height / 2;
  return Math.atan2(cy - oy, cx - ox) * 180 / Math.PI + 90;
}

function setRot(uidVal, ang) {
  const p = state.pieces.find(x => x.uid === uidVal);
  if (!p) return;
  p.rot = ((ang % 360) + 360) % 360;
  const el = canvas.querySelector('.piece[data-uid="' + uidVal + '"]');
  if (el) {
    el.style.transform = 'rotate(' + p.rot + 'deg)';
    const handle = el.querySelector('.rot-handle');
    if (handle) handle.style.transform = 'rotate(' + (-p.rot) + 'deg)';
  }
  selDeg.textContent = Math.round(p.rot) + '°';
}

/* ===== 儀器欄：長按 或 垂直捲動軸方向拖出 =====
   arm 期間：絕對唔 preventDefault／capture／body lock → 輕掃可 scroll */
function clearArmTimer() {
  if (state.drag && state.drag._timer) {
    clearTimeout(state.drag._timer);
    state.drag._timer = null;
  }
}

function onPaletteDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const type = e.currentTarget.dataset.type;
  const inst = findInst(type);
  if (!inst || usedCount(type) >= inst.qty) return;
  const xy = ptrXY(e);
  const srcEl = e.currentTarget;
  /* 只記 arm；唔 capture、唔 preventDefault、唔 lock */
  state.drag = {
    mode: 'arm',
    type,
    srcEl,
    x0: xy.x,
    y0: xy.y,
    pointerId: e.pointerId != null ? e.pointerId : xy.id,
    portrait: isPortraitRow(),
    _timer: null
  };
  srcEl.classList.add('armed');
  state.drag._timer = setTimeout(() => {
    if (!state.drag || state.drag.mode !== 'arm') return;
    /* 長按成功 → 開始拖；此時先 capture */
    const d = state.drag;
    try { if (d.srcEl && e.pointerId != null) d.srcEl.setPointerCapture(e.pointerId); } catch (_) {}
    startPaletteGhost(d.type, { x: d.x0, y: d.y0 }, d.pointerId, d.srcEl);
    setStatus('拖入畫布…');
  }, LONG_PRESS_MS);
}

function startPaletteGhost(type, xy, pointerId, srcEl) {
  clearArmTimer();
  const inst = findInst(type);
  if (!inst) return;
  setDragLock(true);
  if (srcEl) {
    srcEl.classList.remove('armed');
    srcEl.classList.add('dragging-src');
  }
  const sz = instSize(inst);
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.innerHTML = `<div style="width:${sz.w}px;height:${sz.h}px">${inst.svg}</div>`;
  const gsvg = ghost.querySelector('svg');
  if (gsvg) { gsvg.setAttribute('width', sz.w); gsvg.setAttribute('height', sz.h); }
  document.body.appendChild(ghost);
  const ox = sz.w / 2, oy = sz.h / 2;
  ghost.style.transform = 'translate(' + (xy.x - ox) + 'px,' + (xy.y - oy) + 'px)';
  state.drag = { mode: 'palette', type, ghost, ox, oy, pointerId, srcEl };
}

function onPieceDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const body = e.currentTarget;
  const el = body.closest('.piece');
  const p = state.pieces.find(x => x.uid === el.dataset.uid);
  if (!p) return;
  const xy = ptrXY(e);
  state.selected = p.uid;
  el.classList.add('selected', 'dragging');
  try { body.setPointerCapture(e.pointerId); } catch (_) {}
  setDragLock(true);
  updateSelBar();
  const pt = clientToCanvas(xy.x, xy.y);
  state.drag = {
    mode: 'piece',
    uid: p.uid,
    dx: pt.x - p.x,
    dy: pt.y - p.y,
    pointerId: e.pointerId != null ? e.pointerId : xy.id,
    el
  };
}

function onRotDown(e) {
  e.preventDefault();
  e.stopPropagation();
  const handle = e.currentTarget;
  const el = handle.closest('.piece');
  const uidVal = el.dataset.uid;
  const p = state.pieces.find(x => x.uid === uidVal);
  if (!p) return;
  const xy = ptrXY(e);
  state.selected = uidVal;
  el.classList.add('selected');
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
  handle.classList.add('dragging');
  setDragLock(true);
  setRot(uidVal, angleFromCenter(el, xy.x, xy.y));
  state.drag = {
    mode: 'rotate',
    uid: uidVal,
    el, handle,
    pointerId: e.pointerId != null ? e.pointerId : xy.id
  };
}

function onPointerMove(e) {
  if (!state.drag) return;
  if (state.drag.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== state.drag.pointerId) return;
  const xy = ptrXY(e);

  if (state.drag.mode === 'arm') {
    const dx = xy.x - state.drag.x0;
    const dy = xy.y - state.drag.y0;
    const dist = Math.hypot(dx, dy);
    const portrait = !!state.drag.portrait;

    /* 沿 scroll 軸明顯移動 → 取消 arm（交返瀏覽器捲） */
    if (portrait) {
      if (Math.abs(dx) > MOVE_CANCEL_PX && Math.abs(dx) > Math.abs(dy) * 1.15) {
        cancelArm();
        return;
      }
    } else {
      if (Math.abs(dy) > MOVE_CANCEL_PX && Math.abs(dy) > Math.abs(dx) * 1.15) {
        cancelArm();
        return;
      }
    }

    /* 垂直於捲動軸：直接拖出（唔使等長按） */
    let cross = false;
    if (portrait) {
      if (Math.abs(dy) > CROSS_DRAG_PX && Math.abs(dy) >= Math.abs(dx) * 0.85) cross = true;
    } else {
      if (Math.abs(dx) > CROSS_DRAG_PX && Math.abs(dx) >= Math.abs(dy) * 0.85) cross = true;
    }
    if (cross || dist > 40) {
      if (e.cancelable) e.preventDefault();
      const { type, srcEl, pointerId } = state.drag;
      try { if (srcEl && e.pointerId != null) srcEl.setPointerCapture(e.pointerId); } catch (_) {}
      startPaletteGhost(type, xy, pointerId, srcEl);
    }
    return; /* arm 期間唔 preventDefault（除非已轉 drag） */
  }

  if (e.cancelable) e.preventDefault();

  if (state.drag.mode === 'palette') {
    state.drag.ghost.style.transform = 'translate(' + (xy.x - state.drag.ox) + 'px,' + (xy.y - state.drag.oy) + 'px)';
  } else if (state.drag.mode === 'piece') {
    const p = state.pieces.find(x => x.uid === state.drag.uid);
    if (!p) return;
    const inst = findInst(p.type);
    const sz = instSize(inst);
    const pt = clientToCanvas(xy.x, xy.y);
    const maxX = Math.max(0, Math.max(canvas.scrollWidth, canvas.clientWidth) - sz.w);
    const maxY = Math.max(0, Math.max(canvas.scrollHeight, canvas.clientHeight) - sz.h);
    p.x = Math.min(maxX, Math.max(0, pt.x - state.drag.dx));
    p.y = Math.min(maxY, Math.max(0, pt.y - state.drag.dy));
    state.drag.el.style.left = p.x + 'px';
    state.drag.el.style.top = p.y + 'px';
  } else if (state.drag.mode === 'rotate') {
    setRot(state.drag.uid, angleFromCenter(state.drag.el, xy.x, xy.y));
  }
}

function cancelArm() {
  clearArmTimer();
  if (state.drag && state.drag.srcEl) {
    state.drag.srcEl.classList.remove('armed', 'dragging-src');
  }
  state.drag = null;
}

function onPointerUp(e) {
  if (!state.drag) return;
  if (state.drag.pointerId !== undefined && e.pointerId !== undefined && e.pointerId !== state.drag.pointerId) return;
  const xy = ptrXY(e);

  if (state.drag.mode === 'arm') {
    cancelArm();
    return;
  }

  if (state.drag.mode === 'palette') {
    const g = state.drag.ghost;
    const type = state.drag.type;
    if (state.drag.srcEl) state.drag.srcEl.classList.remove('dragging-src', 'armed');
    const r = canvas.getBoundingClientRect();
    const inside = xy.x >= r.left && xy.x <= r.right && xy.y >= r.top && xy.y <= r.bottom;
    if (inside) {
      const inst = findInst(type);
      const sz = instSize(inst);
      const pt = clientToCanvas(xy.x, xy.y);
      addPiece(type, pt.x - sz.w / 2, pt.y - sz.h / 2, 0);
    } else {
      setStatus('未放入畫布');
    }
    if (g && g.parentNode) g.remove();
  } else if (state.drag.mode === 'piece') {
    if (state.drag.el) state.drag.el.classList.remove('dragging');
    renderPieces();
  } else if (state.drag.mode === 'rotate') {
    if (state.drag.handle) state.drag.handle.classList.remove('dragging');
    renderPieces();
  }
  state.drag = null;
  setDragLock(false);
}

function onPieceCtx(e) {
  e.preventDefault();
  const el = e.currentTarget.closest('.piece');
  selectPiece(el.dataset.uid);
  ctxMenu.style.display = 'block';
  ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 170) + 'px';
  ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 180) + 'px';
}
function hideCtx() { ctxMenu.style.display = 'none'; }

canvas.addEventListener('pointerdown', (e) => {
  if (e.target === canvas) { selectPiece(null); hideCtx(); }
});

window.addEventListener('pointermove', onPointerMove, { passive: false });
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

if (!window.PointerEvent) {
  document.addEventListener('touchmove', onPointerMove, { passive: false });
  document.addEventListener('touchend', onPointerUp, { passive: false });
  document.addEventListener('touchcancel', onPointerUp, { passive: false });
}

window.addEventListener('resize', () => { if (state.pieces.length) renderPieces(); });
window.addEventListener('click', (e) => { if (!ctxMenu.contains(e.target)) hideCtx(); });

ctxMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'flip') rotateSelected(180);
  else if (act === 'front') bringFront();
  else if (act === 'delete') deletePiece(state.selected);
  hideCtx();
});

document.getElementById('btn-flip').onclick = () => rotateSelected(180);
document.getElementById('btn-front').onclick = () => bringFront();
document.getElementById('btn-back').onclick = () => sendBack();
document.getElementById('btn-delete').onclick = () => deletePiece(state.selected);
document.getElementById('btn-reset').onclick = () => {
  if (state.pieces.length && !confirm('清空畫布上所有儀器？')) return;
  state.pieces = [];
  state.selected = null;
  renderPieces();
  setStatus('已重置');
};
document.getElementById('btn-print').onclick = () => window.print();

document.addEventListener('keydown', (e) => {
  if (!state.selected) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deletePiece(state.selected); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); rotateSelected(-5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); rotateSelected(5); }
});

document.addEventListener('selectstart', (e) => {
  if (isHardDrag() || e.target.closest('.piece, .palette-item, .rot-handle')) e.preventDefault();
});
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.palette-item, .rot-handle')) e.preventDefault();
});

renderPalette();
updateEmpty();
setStatus('就緒');
</script>
</body>
</html>
