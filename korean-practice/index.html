<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>韓文初階練習</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #fff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e5e1d8;
    --primary: #1f4b99;
    --primary-text: #fff;
    --ok: #1a7f4b;
    --bad: #b42318;
    --info: #e8f0fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .label { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
  .seg {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .seg button {
    border: 1px solid var(--border);
    background: #fafafa;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .seg button.active {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
  }
  .prompt {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 8px 0 4px;
    word-break: break-word;
  }
  .feedback { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; white-space: pre-wrap; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .choices { display: grid; gap: 8px; }
  .choices button {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 1.05rem;
    cursor: pointer;
  }
  .choices button:disabled { opacity: 0.85; cursor: default; }
  .choices button.correct {
    border-color: var(--ok);
    background: #eaf7ef;
  }
  .choices button.wrong {
    border-color: var(--bad);
    background: #fdeceb;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }
  .btn {
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    background: var(--primary);
    color: var(--primary-text);
  }
  .btn.secondary {
    background: #eee;
    color: var(--text);
  }
  .info {
    background: var(--info);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.9rem;
  }
  pre.report {
    white-space: pre-wrap;
    word-break: break-word;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.85rem;
    margin: 8px 0 0;
  }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .hidden { display: none !important; }
  .next-bar {
    position: sticky;
    bottom: 0;
    z-index: 20;
    margin: 12px -16px -16px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--card) 70%, rgba(255,255,255,0));
    display: flex;
    justify-content: stretch;
  }
  .next-bar .btn {
    width: 100%;
    min-height: 48px;
    font-size: 1.05rem;
    border-radius: 14px;
  }
  body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>

  <h1>韓文初階練習</h1>
  <p class="sub">手機可開 · 每次 10–15 題 · 答完顯示拼音 · 結束可複製明細貼畀韓仔</p>

  <div class="card info" id="note">
    每次 10–15 題。新增「文法을／를」：撳掣揀을或를，唔使打韓文。預設開呢個包。</div>

  <div class="card">
    <div class="label">揀練習</div>
    <div class="seg" id="packSeg"></div>
  </div>

  <div class="card">
    <div class="label">練習模式</div>
    <div class="seg" id="modeSeg"></div>
  </div>

    <div class="row">

      <button class="btn" id="nextBtn" type="button">下一題</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="row">
      <strong id="resultTitle">完成！</strong>
      <button class="btn" id="copyBtn" type="button">複製明細</button>
    </div>
    <p class="meta" id="copyMsg">撳「複製明細」，再貼去同韓仔聊天。</p>
    <pre class="report" id="report"></pre>
    <div class="row">

];
const CONTRAST = [
  { kr:"내일", zh:"明天", rom:"naeil" },
  { kr:"어디", zh:"邊度", rom:"eodi" },
  { kr:"어떻게", zh:"點樣", rom:"eotteoke" },
  { kr:"지금", zh:"而家", rom:"jigeum" },

/* 錯字加權重複，對照字較少 */
const REVIEW = WEAK.concat(WEAK, WEAK, CONTRAST);


const EUL = [
  { blank:"사과___ 먹어요。", zh:"食蘋果", rom:"sagwa-reul meogeoyo", answer:"를", full:"사과를 먹어요" },
  { blank:"물___ 마셔요。", zh:"飲水", rom:"mul-eul masyeoyo", answer:"을", full:"물을 마셔요" },
  { blank:"책___ 읽어요。", zh:"讀書", rom:"chaek-eul ilgeoyo", answer:"을", full:"책을 읽어요" },
  { blank:"친구___ 만나요。", zh:"見朋友", rom:"chingu-reul mannayo", answer:"를", full:"친구를 만나요" },
  { blank:"밥___ 먹어요。", zh:"食飯", rom:"bab-eul meogeoyo", answer:"을", full:"밥을 먹어요" },
  { blank:"커피___ 마셔요。", zh:"飲咖啡", rom:"keopi-reul masyeoyo", answer:"를", full:"커피를 마셔요" },

  { blank:"영화___ 봐요。", zh:"睇戲", rom:"yeonghwa-reul bwayo", answer:"를", full:"영화를 봐요" },
  { blank:"음악___ 들어요。", zh:"聽音樂", rom:"eumak-eul deureoyo", answer:"을", full:"음악을 들어요" },
  { blank:"이름___ 써요。", zh:"寫名", rom:"ireum-eul sseoyo", answer:"을", full:"이름을 써요" },
  { blank:"빵___ 사요。", zh:"買麵包", rom:"ppang-eul sayo", answer:"을", full:"빵을 사요" },

  { blank:"과일___ 먹어요。", zh:"食生果", rom:"gwail-eul meogeoyo", answer:"을", full:"과일을 먹어요" },
  { blank:"편지___ 써요。", zh:"寫信", rom:"pyeonji-reul sseoyo", answer:"를", full:"편지를 써요" },
  { blank:"한국어___ 공부해요。", zh:"學韓文", rom:"hangugeo-reul gongbuhaeyo", answer:"를", full:"한국어를 공부해요" },
];

const PACKS = {
  eul: { label: "文法을／를", cards: EUL, kind: "particle" },
  food: { label: "食物", cards: FOOD },
  review: { label: "錯題加強", cards: REVIEW },
  mix: { label: "進階混合", cards: MIX },
  school: { label: "學校生活", cards: SCHOOL },
  verbs: { label: "動詞形容詞", cards: VERBS },
  basic: { label: "常用字", cards: BASIC },
};

let pack = "eul";
let mode = "kr2zh";
let deck = [];
let index = 0;
let score = 0;
let picked = null;
let log = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function uniqueByKr(cards) {
  const seen = {};
  const out = [];
  for (const c of cards) {
    const key = c.kr || c.blank || c.full;
    if (seen[key]) continue;
    seen[key] = true;
    out.push(c);
  }
  return out;
}
function pickChoices(correct, all) {
  const pool = uniqueByKr(all).filter(c => c.kr !== correct.kr);
  const distractors = shuffle(pool).slice(0, 3).map(c => mode === "kr2zh" ? c.zh : c.kr);
  const right = mode === "kr2zh" ? correct.zh : correct.kr;
  return shuffle([right].concat(distractors));
}
function isParticle() { return PACKS[pack].kind === "particle"; }
function modeLabel() {
  if (isParticle()) return "揀을／를";
  return mode === "kr2zh" ? "睇韓揀中" : "睇中揀韓";
}
function packLabel() { return PACKS[pack].label; }
function buildReport() {
  const ok = log.filter(x => x.ok).map(x =>
    isParticle()
      ? `- ${x.full}（${x.rom}）= ${x.zh}`
      : `- ${x.kr} = ${x.zh} (${x.rom})`
  );
  const bad = log.filter(x => !x.ok).map(x =>
    isParticle()
      ? `- ${x.blank}｜正解：${x.answer}｜你揀：${x.chosen}｜${x.full}（${x.rom}）`
      : `- ${x.kr} = ${x.zh} (${x.rom})｜你揀：${x.chosen}`
  );
  return [
    `成績：${score}/${deck.length}｜模式：${modeLabel()}｜練習：${packLabel()}`,
    "答啱：",
    ok.length ? ok.join("\n") : "- （無）",
    "答錯：",
    bad.length ? bad.join("\n") : "- （無）",
  ].join("\n");
}

function renderSeg(el, options, current, onChange) {
  el.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = opt.label;
    if (opt.value === current) b.classList.add("active");
    b.onclick = () => onChange(opt.value);
    el.appendChild(b);
  });
}

const ROUND_MIN = 10;
const ROUND_MAX = 15;

function buildDeck(cards) {
  const target = ROUND_MIN + Math.floor(Math.random() * (ROUND_MAX - ROUND_MIN + 1));
  let out = shuffle(cards);
  if (out.length >= target) return out.slice(0, target);
  const uniq = uniqueByKr(cards);
  while (out.length < target) {
    out = out.concat(shuffle(uniq.length ? uniq : cards));
  }
  return out.slice(0, target);
}

function resetRound() {
  deck = buildDeck(PACKS[pack].cards);
  index = 0;
  score = 0;
  picked = null;
  log = [];
  document.getElementById("copyMsg").textContent = "撳「複製明細」，再貼去同韓仔聊天。";
  showQuiz();
}

function showQuiz() {
  document.getElementById("quizCard").classList.remove("hidden");
  document.getElementById("resultCard").classList.add("hidden");
  if (index >= deck.length) {
    showResult();
    return;
  }
  const card = deck[index];
  document.getElementById("progress").textContent = `第 ${index + 1}／${deck.length} 題 · ${packLabel()}`;
  document.getElementById("scoreLive").textContent = `目前分數：${score}`;
  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  document.getElementById("nextBar").classList.add("hidden");
  let choices;
  if (isParticle()) {
    document.getElementById("qLabel").textContent = "揀을定를？（" + card.zh + "）";
    document.getElementById("prompt").textContent = card.blank;
    fb.textContent = "有받침用을，無用를。撳下面掣。";
    choices = shuffle(["을", "를"]);
  } else {
    const prompt = mode === "kr2zh" ? card.kr : card.zh;
    document.getElementById("qLabel").textContent = mode === "kr2zh" ? "呢個韓文係咩意思？" : "點樣用韓文講？";
    document.getElementById("prompt").textContent = prompt;
    fb.textContent = "揀下面其中一個答案。";
    choices = pickChoices(card, PACKS[pack].cards);
  }
  const box = document.getElementById("choices");
  box.innerHTML = "";
  choices.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c;
    b.onclick = () => onPick(c, b, choices);
    box.appendChild(b);
  });
}

function onPick(choice, btn, choices) {
  if (picked !== null) return;
  const card = deck[index];
  const correct = isParticle() ? card.answer : (mode === "kr2zh" ? card.zh : card.kr);
  picked = choice;
  const ok = choice === correct;
  if (ok) score += 1;
  if (isParticle()) {
    log.push({ blank: card.blank, zh: card.zh, rom: card.rom, answer: card.answer, full: card.full, ok, chosen: choice });
  } else {
    log.push({ kr: card.kr, zh: card.zh, rom: card.rom, ok, chosen: choice });
  }
  const fb = document.getElementById("feedback");
  if (ok) {
    fb.className = "feedback ok";
    fb.textContent = isParticle()
      ? `啱！${card.full}　拼音：${card.rom}`
      : `啱！拼音：${card.rom}`;
  } else {
    fb.className = "feedback bad";
    fb.textContent = isParticle()
      ? `唔啱。正解：${card.answer} → ${card.full}　拼音：${card.rom}`
      : `唔啱。正確係：${correct}　拼音：${card.rom}`;
  }
  Array.from(document.getElementById("choices").children).forEach(el => {
    el.disabled = true;
    const t = el.textContent.replace(/^✓ |^✗ /, "");
    if (t === correct) {
      el.classList.add("correct");
      el.textContent = "✓ " + t;
    } else if (t === choice) {
      el.classList.add("wrong");
      el.textContent = "✗ " + t;
    }
  });
  document.getElementById("scoreLive").textContent = `目前分數：${score}`;
  document.getElementById("nextBar").classList.remove("hidden");
}

function showResult() {
  document.getElementById("quizCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
  document.getElementById("resultTitle").textContent = `完成！你答啱 ${score}／${deck.length} 題`;
  document.getElementById("report").textContent = buildReport();
}

document.getElementById("nextBtn").onclick = () => {
  picked = null;
  index += 1;
  showQuiz();
};
document.getElementById("restartBtn").onclick = resetRound;
document.getElementById("copyBtn").onclick = async () => {
  const text = buildReport();
  const msg = document.getElementById("copyMsg");
  try {
    await navigator.clipboard.writeText(text);
    msg.textContent = "已複製！直接貼去同韓仔聊天就得。";
  } catch (e) {
    msg.textContent = "一鍵複製唔成功，請長按下面明細手動複製。";
  }
};

const PACK_OPTS = [
  { value: "eul", label: "을／를" },
  { value: "food", label: "食物" },
  { value: "review", label: "錯題" },
  { value: "mix", label: "進階" },
  { value: "school", label: "學校" },
  { value: "verbs", label: "動詞" },
  { value: "basic", label: "常用" },
];
const MODE_OPTS = [
  { value: "kr2zh", label: "睇韓揀中" },
  { value: "zh2kr", label: "睇中揀韓" },
];

function syncModeVisibility() {
  const modeCard = document.getElementById("modeSeg").closest(".card");
  if (modeCard) modeCard.classList.toggle("hidden", isParticle());
}
function redrawPacks() {
  renderSeg(document.getElementById("packSeg"), PACK_OPTS, pack, v => {
    pack = v;
    syncModeVisibility();
    resetRound();
    redrawPacks();
  });
}
function redrawModes() {
  renderSeg(document.getElementById("modeSeg"), MODE_OPTS, mode, v => {
    mode = v;
    resetRound();
    redrawModes();
  });
}

redrawPacks();
redrawModes();
syncModeVisibility();
resetRound();

</script>
</body>
